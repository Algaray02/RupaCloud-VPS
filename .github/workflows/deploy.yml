name: Deploy to RupaCloud (Next.js - Cloud Build)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build in Cloud & Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (7GB RAM Runner)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Next.js
        env:
          APP_ENV_CONTENT: ${{ secrets.APP_ENV }}
        run: |
          set -e
          
          if [ -n "$APP_ENV_CONTENT" ]; then
            echo "$APP_ENV_CONTENT" > .env
          fi
          npm install
          if [ -f prisma/schema.prisma ] || grep -q 'prisma' package.json 2>/dev/null; then
            npx prisma generate || true
          fi
          npm run build
          # Hapus cache compiler internal (.next/cache) agar ukuran arsip turun dari ~300MB jadi ~5-10MB
          rm -rf .next/cache
          tar -czf "$GITHUB_WORKSPACE/build.tar.gz" .next $([ -d public ] && echo "public") package.json $([ -f package-lock.json ] && echo "package-lock.json") $(ls next.config.* 2>/dev/null || true) $([ -f .env ] && echo ".env") $([ -d prisma ] && echo "prisma")

      - name: Transfer Build Artifacts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build.tar.gz"
          target: "~/app"

      - name: Extract & Launch Application on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p ~/app
            cd ~/app
            tar -xzf build.tar.gz
            rm -f build.tar.gz
            npm install --omit=dev
            if [ -f prisma/schema.prisma ]; then
              npx prisma db push --skip-generate 2>/dev/null || true
            fi
            if which nginx >/dev/null 2>&1; then
              cat << 'NGINX_EOF' > /etc/nginx/sites-available/default
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                location / {
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host $host;
                    proxy_cache_bypass $http_upgrade;
                }
            }
            NGINX_EOF
              nginx -t 2>/dev/null && systemctl reload nginx 2>/dev/null || true
            fi
            pm2 delete app 2>/dev/null || true
            pm2 start npm --name app -- start -- -p 3000
            pm2 save 2>/dev/null || true
